<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>

  <!-- Celular -->
  <rect x="20" y="20" width="540" height="440" rx="16" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="40" y="48" font-weight="700" fill="#3730a3" font-size="15">Celular Android — NetFloor Shell (APK)</text>

  <rect x="40" y="62" width="500" height="228" rx="12" fill="#ffffff" stroke="#818cf8"/>
  <text x="56" y="84" font-weight="600" fill="#3730a3">WebView (Chromium do Android)</text>
  <rect x="58" y="96" width="464" height="180" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="74" y="119" font-weight="700" fill="#1e1b4b">NetFloor Web — Flutter Web / Dart (lib/main.dart)</text>
  <text x="74" y="142">• Simulador 2.5D (CustomPainter, ray-casting)</text>
  <text x="74" y="162">• Diagnóstico Wi-Fi (fl_chart + SpectrumPainter)</text>
  <text x="74" y="182">• Upload de plantas em memória (file_picker → Uint8List)</text>
  <text x="74" y="208" fill="#475569">window.NetFloorNative presente → dados reais do aparelho</text>
  <text x="74" y="228" fill="#475569">ausente (navegador comum) → modo simulação</text>
  <text x="74" y="256" fill="#475569" font-style="italic">carregado de https://rogerdev5690.github.io/netfloor/</text>

  <rect x="40" y="330" width="240" height="112" rx="12" fill="#fff7ed" stroke="#f97316"/>
  <text x="56" y="354" font-weight="700" fill="#9a3412">Shell — Flutter / Dart</text>
  <text x="56" y="376">webview_flutter · ponte JS</text>
  <text x="56" y="396">permission_handler · file_picker</text>
  <text x="56" y="416">navegação restrita ao domínio</text>

  <rect x="310" y="330" width="230" height="112" rx="12" fill="#ecfdf5" stroke="#10b981"/>
  <text x="326" y="354" font-weight="700" fill="#065f46">Kotlin — MainActivity</text>
  <text x="326" y="376">WifiManager: scan, RSSI, PHY</text>
  <text x="326" y="396">DhcpInfo: IP do gateway</text>
  <text x="326" y="416">ping ICMP + fallback TCP</text>

  <line x1="160" y1="290" x2="160" y2="328" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="180" y1="328" x2="180" y2="292" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="192" y="314" fill="#334155" font-size="12">Ponte JS (NetFloorNative)</text>
  <line x1="282" y1="386" x2="308" y2="386" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="240" y="322" fill="#334155" font-size="11" text-anchor="middle"> </text>
  <text x="295" y="470" fill="#334155" font-size="11" text-anchor="middle">MethodChannel netfloor/diag</text>

  <!-- GitHub -->
  <rect x="600" y="20" width="280" height="440" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="48" font-weight="700" fill="#0f172a" font-size="15">GitHub — hospedagem estática</text>

  <rect x="620" y="66" width="240" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="634" y="90" font-weight="700" fill="#1e3a8a">GitHub Pages</text>
  <text x="634" y="110">branch gh-pages (build web)</text>
  <text x="634" y="130">rogerdev5690.github.io/netfloor</text>

  <rect x="620" y="170" width="240" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="634" y="194" font-weight="700" fill="#0f172a">Repositório netfloor (main)</text>
  <text x="634" y="214">código-fonte Flutter Web</text>
  <text x="634" y="232">assets/floorplans/ (imagens)</text>

  <rect x="620" y="264" width="240" height="78" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="634" y="288" font-weight="700" fill="#0f172a">Repositório netfloor-shell</text>
  <text x="634" y="308">código do Shell (Dart + Kotlin)</text>
  <text x="634" y="326">versão atual: 3.1.0</text>

  <rect x="620" y="358" width="240" height="84" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="634" y="382" font-weight="700" fill="#78350f">Releases</text>
  <text x="634" y="402">APKs v1.0.0 … v3.1.0</text>
  <text x="634" y="422">raw.githubusercontent.com (imagens)</text>

  <line x1="522" y1="150" x2="618" y2="110" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="530" y="112" fill="#334155" font-size="12">HTTPS · OTA</text>
  <line x1="618" y1="400" x2="542" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="560" y="392" fill="#334155" font-size="11" text-anchor="middle">APK</text>
</svg>
