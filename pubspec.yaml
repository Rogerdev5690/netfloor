name: netfloor
description: "NetFloor - simulador visual de mapa de calor de sinal Wi-Fi Mesh."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  pdf: ^3.13.1
  web: ^1.1.1
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  image: ^4.10.1

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/floorplans/
    - assets/fonts/
